<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='loginReg.css') }}">
    </head>
    <body>
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <ul class=flashes>
                {% for message in messages %}
                <li>{{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}
        {% block body %}{% endblock %}
        <div class="card">
            <h2 id = "title">Login</h2>
            <form action = "#" method = "post">
                <p><input type = "email" name = "email" placeholder="Enter Email"></p>
                <p><input type = "password" name = "pwd" placeholder="Enter Password"></p>
            <button id = "login" type="submit">Submit</button>
             </form>
        </div>
    </body>
</html>
