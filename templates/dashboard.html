<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
        
    </head>
    <body>
        <div class="nav_bar">
        <a href="{{url_for('user.dashboard')}}" class = "active">Dashboard</a>
        <a href="{{url_for('user.history')}}">History</a>
        <a href="{{url_for('auth.logout')}}">Logout</a>
        </div>
        <div class="card">
            <h2 id="title">My Bills</h2>
            <ul id="billList">
                <li>Test</li>

            </ul>
            <button id="add">Add bill</button>
        </div>

        <div class = "add_modal">
            <div class = "add_content">
                <span class="close">&times;</span>
                <form>
                    <label for = "recipient">Recipient:</label>
                    <input type = "text" id = "recipient" name = "recipient_user" placeholder="Enter Username" required>
                    
                    <label for="amount">Amount (£):</label>
                    <input type="number" id="amount" name="amount" step="0.01" min="0.01" placeholder="0.00" required>
                    
                    <button id = "add_bill_button" type="submit">Send Bill</button>
                </form>
            </div>
        </div>
        <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
